spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: 13009
      password: ${REDIS_PASSWORD}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: PostgreSQL-Hikari
      maximum-pool-size: 10
      minimum-idle: 2

      connection-timeout: 5000
      validation-timeout: 3000

      idle-timeout: 600000
      max-lifetime: 1800000

      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    # A deployment that does not set KAFKA_BOOTSTRAP_SERVERS keeps the old
    # single-node behaviour rather than failing to start.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: ${KAFKA_ANALYTICS_GROUP_ID:click4bonds-analytics}
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "com.click4bonds.app.Modules.Analytics.Model"
        spring.json.value.default.type: "com.click4bonds.app.Modules.Analytics.Model.AnalyticsEvent"
        spring.json.use.type.headers: false

# Credentials come from the environment. The defaults are the stock local
# ClickHouse ones so that a deployment that never uses analytics still starts.
clickhouse:
  url: jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DATABASE:click4bonds_analytics}
  username: ${CLICKHOUSE_USERNAME}
  password: ${CLICKHOUSE_PASSWORD}

