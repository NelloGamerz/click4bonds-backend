# Authentication's own settings are shared from application.yaml; production
# only has to supply the signing key, which comes from the environment and has
# no default by design.
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}

frontend:
  url: ${FRONTEND_URL}
  www-url: ${FRONTEND_WWW_URL}

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    com.click4bonds: INFO

rcs:
  api:
    base-url: https://biz.sms4power.com/api/RCSApi
    api-key: ${RCS_API_KEY}
    otp-template-id: ${RCS_OTP_TEMPLATE_ID}

resend:
  api-key: ${RESEND_API_KEY}
  from: ${RESEND_FROM_EMAIL}

otp:
  length: ${OTP_LENGTH}
  expiry-minutes: ${OTP_EXPIRY_MINUTES}
  max-attempts: ${OTP_MAX_ATTEMPTS}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS}
  hash-secret: ${OTP_HASH_SECRET}


management:
  endpoints:
    web:
      exposure:
        include: [ health, info, metrics, prometheus ]

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true          # /health/liveness + /health/readiness

  metrics:
    tags:
      application: click4bonds
      env: prod
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

  observations:
    key-values:
      application: click4bonds

  # only once you add the tracing deps + a trace store
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: http://clickforbonds-alloy:4318/v1/traces

sms:
  gateway:
      base-url: http://125.16.147.178/VoicenSMS/webresources/CreateSMSCampaignGet
      ukey: ${SMS_GATEWAY_UKEY}
      sender-id: CLKBND
      otp-message: Dear customer your click4bond login OTP is <arg1>. Please enter it to login. Valid for 10 mins. Do not share this code. Thanks - CLICK4BOND
